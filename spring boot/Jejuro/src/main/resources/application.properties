spring.application.name=jejuro
server.port=8080

# 내 PC 전용 설정(application-local.properties: DB 비밀번호·카카오 키)을 함께 읽는다. 이 파일은 깃허브에 올리지 않는다.
spring.profiles.active=local

# ===== DB =====
spring.datasource.url=jdbc:mysql://localhost:3306/jejuro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA =====
# 테이블은 DB/jejuro_*.sql 로 만든다. JPA가 테이블을 만들거나 바꾸지 않게 함
spring.jpa.hibernate.ddl-auto=none
# 테이블 이름을 소문자(travel)로 쓰는 규칙 — DB 덤프가 소문자라 Linux·Windows MySQL 모두에서 동작
spring.jpa.hibernate.naming.physical-strategy=kr.fast.Jejuro.Config.LowerCaseTableNamingStrategy
spring.jpa.open-in-view=false
# 개발 중 실행 SQL 확인용
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== AI 추천 (2페이지) =====
# mock: 가짜 AI(개발용) / http: 실제 AI 서버 호출
ai.mode=http
ai.base-url=http://127.0.0.1:8000

# ===== 카카오 길찾기 (6페이지) =====
# 실제 키는 application-local.properties 에 넣는다
kakao.mobility.rest-key=${KAKAO_REST_KEY:}

# ===== 관리자 AI KPI =====
# 재학습 데이터셋(AI_TRAINING_DATASET)에 들어간 여행(후기까지 끝난 여행)이 이만큼 쌓이면 재학습 요청 가능
admin.retrain-threshold=100

# 커뮤니티 첨부 사진 (Spring 실행 폴더 기준 uploads/community 에 저장. 깃에는 올리지 않음)
app.upload-dir=uploads/community
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== 날씨 (여행 상세 - 확정한 일정 관광지별, Open-Meteo · 키 없음) =====
# 관광지 좌표·날짜로 오전/오후 날씨, 최저/최고 기온. 끄려면 false
weather.enabled=true

# ===== 예상 택시비 (제주 중형택시, 2024.07.01 시행) =====
# 기본요금(원)·기본거리(m) 이후 unit-distance-m 마다 unit-fare 원
taxi.base-fare=4300
taxi.base-distance-m=2000
taxi.unit-distance-m=126
taxi.unit-fare=100

# ===== 프록시 뒤 실제 접속 IP =====
# nginx·로드밸런서 같은 내부망(10.x, 172.16~31.x, 192.168.x, 127.x) 프록시가 보낸 X-Forwarded-For 만 믿고
# 실제 사용자 IP를 request.getRemoteAddr() 로 돌려준다. (외부에서 직접 보낸 X-Forwarded-For 는 무시 → IP 위조 불가)
# 프록시 없이 실행하면 아무 영향 없음. 이메일 인증 발송의 IP별 제한이 모든 사용자를 같은 IP로 세지 않게 한다.
server.forward-headers-strategy=native

# Login session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== 이메일 인증 (Gmail SMTP) =====
# 아이디·앱 비밀번호는 application-local.properties 또는 환경변수(MAIL_USERNAME, MAIL_PASSWORD)에 넣는다
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== 소셜 계정 연동 =====
# 로그인·연동이 끝나면 돌아갈 React 주소
app.frontend-url=http://localhost:3000

# 카카오·네이버 주소 (구글은 Spring 기본값 사용). 키는 application-local.properties 에만 넣습니다.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===== 탈퇴 회원 자동 삭제 =====
# 탈퇴 요청 후 보관 기간(일). 지나면 매일 새벽 sp_purge_user 로 완전 삭제
withdrawal.retention-days=30
# 실행 시각 (초 분 시 일 월 요일, 한국 시간) - 매일 04:00
withdrawal.purge-cron=0 0 4 * * *
