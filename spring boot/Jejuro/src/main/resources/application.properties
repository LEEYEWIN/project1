spring.application.name=Jejuro
server.port=8080

# 내 PC 전용 설정(application-local.properties: DB 비밀번호·카카오 키)을 함께 읽는다. 이 파일은 깃허브에 올리지 않는다.
spring.profiles.active=local

# ===== DB =====
spring.datasource.url=jdbc:mysql://localhost:3306/jeju_travel?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA =====
# 테이블은 jeju_schema.sql로 만든다. JPA가 테이블을 만들거나 바꾸지 않게 함
spring.jpa.hibernate.ddl-auto=none
# 테이블 이름을 대문자 그대로(TRAVEL) 쓰게 하는 규칙
spring.jpa.hibernate.naming.physical-strategy=kr.fast.Jejuro.Config.UpperCaseTableNamingStrategy
spring.jpa.open-in-view=false
# 개발 중 실행 SQL 확인용
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== AI 추천 (2페이지) =====
# mock: 가짜 AI(개발용) / http: 실제 AI 서버 호출
ai.mode=mock
ai.base-url=http://localhost:8000
ai.timeout-seconds=30

# ===== 카카오 길찾기 (6페이지) =====
# 실제 키는 application-local.properties 에 넣는다
kakao.mobility.rest-key=${KAKAO_REST_KEY:}

# ===== 로그인 대신 테스트 회원 전환 (X-User-Id 헤더) =====
app.test-login.enabled=true
app.test-login.default-user-id=1