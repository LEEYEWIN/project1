spring.application.name=Jejuro
server.port=8080

# 내 PC 전용 설정(application-local.properties: DB 비밀번호·카카오 키)을 함께 읽는다. 이 파일은 깃허브에 올리지 않는다.
spring.profiles.active=local

# ===== DB =====
spring.datasource.url=jdbc:mysql://localhost:3306/jeju_travel?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA =====
# 테이블은 jeju_schema.sql로 만든다. JPA가 테이블을 만들거나 바꾸지 않게 함
spring.jpa.hibernate.ddl-auto=none
# 테이블 이름을 대문자 그대로(TRAVEL) 쓰게 하는 규칙
spring.jpa.hibernate.naming.physical-strategy=kr.fast.Jejuro.Config.UpperCaseTableNamingStrategy
spring.jpa.open-in-view=false
# 개발 중 실행 SQL 확인용
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== AI 추천 (2페이지) =====
# mock: 가짜 AI(개발용) / http: 실제 AI 서버 호출
ai.mode=http
ai.base-url=http://127.0.0.1:8000

# ===== 카카오 길찾기 (6페이지) =====
# 실제 키는 application-local.properties 에 넣는다
kakao.mobility.rest-key=${KAKAO_REST_KEY:}

# ===== 로그인 대신 테스트 회원 전환 (X-User-Id 헤더) =====
app.test-login.enabled=true
app.test-login.default-user-id=1

# 커뮤니티 첨부 사진 (Spring 실행 폴더 기준 uploads/community 에 저장. 깃에는 올리지 않음)
app.upload-dir=uploads/community
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== 날씨 (내 여행 달력, Open-Meteo · 키 없음) =====
weather.enabled=true
# 예보 지점 (제주시청 근처)
weather.latitude=33.4996
weather.longitude=126.5312

# ===== 예상 택시비 (제주 중형택시, 2024.07.01 시행) =====
# 기본요금(원)·기본거리(m) 이후 unit-distance-m 마다 unit-fare 원
taxi.base-fare=4300
taxi.base-distance-m=2000
taxi.unit-distance-m=126
taxi.unit-fare=100